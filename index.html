<!-- ส่วนรูปโปรไฟล์ร้าน -->
<div class="profile">
    <img id="profileImage"
         src="https://placehold.co/150x150/160000/ff2020?text=PC+ZONE"
         alt="PC ZONE">

    <h2 id="profileName">PC ZONE</h2>

    <div id="profileEditor" hidden>
        <label>เปลี่ยนรูปโปรไฟล์ร้าน</label>
        <input type="file"
               accept="image/*"
               onchange="changeImage(event, 'profileImage')">

        <label>เปลี่ยนชื่อร้าน</label>
        <input type="text"
               id="newProfileName"
               placeholder="PC ZONE">

        <button onclick="saveProfile()">บันทึกโปรไฟล์</button>
    </div>
</div>

<!-- ส่วนภาพปกเว็บไซต์ -->
<section class="banner">
    <img id="bannerImage"
         src="https://placehold.co/1000x300/180000/ff2020?text=PC+ZONE"
         alt="ภาพปก PC ZONE">

    <div id="bannerEditor" hidden>
        <label>เปลี่ยนรูปปกเว็บไซต์</label>
        <input type="file"
               accept="image/*"
               onchange="changeImage(event, 'bannerImage')">
    </div>
</section>

<!-- ส่วนสินค้า -->
<section class="products">
    <h2>สินค้าแนะนำ</h2>

    <div id="productList"></div>

    <div id="productEditor" hidden>
        <h3>เพิ่มสินค้า</h3>

        <label>ชื่อสินค้า</label>
        <input id="productName" placeholder="ชื่อสินค้า">

        <label>ราคา</label>
        <input id="productPrice" placeholder="฿39.00">

        <label>รายละเอียดสินค้า</label>
        <textarea id="productDescription"></textarea>

        <label>รูปปกสินค้า</label>
        <input type="file"
               id="productImage"
               accept="image/*">

        <button onclick="addProduct()">เพิ่มสินค้า</button>
    </div>
</section>

<!-- เข้าสู่ระบบผู้ดูแล -->
<div id="loginBox">
    <h3>เข้าสู่ระบบผู้ดูแล</h3>

    <input type="password"
           id="adminPassword"
           placeholder="รหัสผ่าน">

    <button onclick="loginAdmin()">เข้าสู่ระบบ</button>

    <button onclick="skipLogin()">ข้ามเข้าสู่เว็บไซต์</button>

    <p id="loginMessage"></p>
